name: Build ImmortalWrt for 360T6GS

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  REPO_URL: https://github.com/kelvinzer0/immortalwrt
  REPO_BRANCH: openwrt-23.05
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget \
        subversion ccache upx xsltproc libxml-parser-perl
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        df -hT $PWD
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    - name: Verify device support
      run: |
        cd $OPENWRT_PATH
        echo "=== Checking for 360T6GS device support ==="
        if grep -r "360_360t6gs" target/linux/ramips/image/mt7621.mk; then
          echo "✓ Device definition found in mt7621.mk"
        else
          echo "::error::Device 360_360t6gs NOT found in source tree!"
          exit 1
        fi
        if [ -f target/linux/ramips/dts/mt7621_360_360t6gs.dts ]; then
          echo "✓ DTS file found"
        else
          echo "::error::DTS file NOT found!"
          exit 1
        fi

    - name: Update feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate configuration file
      run: |
        cd $OPENWRT_PATH

        echo "=== Creating .config ==="
        cat > .config <<'CONFIG_EOF'
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_360_360t6gs=y

        # Remove LuCI (save space for 16MB flash)
        # CONFIG_PACKAGE_luci is not set
        # CONFIG_PACKAGE_luci-ssl-openssl is not set

        # WiFi drivers
        CONFIG_PACKAGE_kmod-mt7915e=y
        CONFIG_PACKAGE_kmod-mt7915-firmware=y

        # Captive portal & PHP (php8 on openwrt-23.05)
        CONFIG_PACKAGE_opennds=y
        CONFIG_PACKAGE_uhttpd=y
        CONFIG_PACKAGE_php8-cgi=y
        CONFIG_PACKAGE_php8-mod-openssl=y

        # DNS
        # CONFIG_PACKAGE_dnsmasq is not set
        CONFIG_PACKAGE_dnsmasq-full=y

        # WireGuard
        CONFIG_PACKAGE_kmod-wireguard=y
        CONFIG_PACKAGE_wireguard-tools=y
        CONFIG_PACKAGE_luci-proto-wireguard=y

        # Multi-WAN load balancer
        CONFIG_PACKAGE_mwan3=y

        # Remove unnecessary packages
        # CONFIG_PACKAGE_ppp is not set
        # CONFIG_PACKAGE_ppp-mod-pppoe is not set
        CONFIG_EOF

        sed -i 's/^[ \t]*//' .config

        echo "=== Running defconfig ==="
        make defconfig 2>&1 | tee defconfig.log

        if [ ! -f .config ]; then
          echo "::error::.config file not created!"
          exit 1
        fi

        echo "=== Verifying critical config ==="
        echo "--- Device ---"
        grep "CONFIG_TARGET_ramips_mt7621_DEVICE_360_360t6gs" .config
        echo "--- WireGuard ---"
        grep "CONFIG_PACKAGE_kmod-wireguard" .config || true
        grep "CONFIG_PACKAGE_wireguard-tools" .config || true
        grep "CONFIG_PACKAGE_luci-proto-wireguard" .config || true
        echo "--- Kernel ---"
        grep "CONFIG_LINUX_5_15" .config || true

    - name: Download packages
      id: package
      run: |
        cd $OPENWRT_PATH
        make download -j$(nproc) || make download -j1 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo "=== Starting compilation with $(nproc) threads ==="

        make -j$(($(nproc) + 1)) || make -j1 V=s || {
          echo "::error::Compilation failed!"
          tail -200 logs/*.log 2>/dev/null || true
          exit 1
        }

        echo "✓ Compilation successful"

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        set -e
        FIRMWARE_DIR=$(find $OPENWRT_PATH/bin/targets/ramips/mt7621 -maxdepth 0 -type d 2>/dev/null || \
                       find $OPENWRT_PATH/bin/targets -type d -mindepth 2 -maxdepth 2 | head -n1)
        cd "$FIRMWARE_DIR"

        UPLOAD_DIR="$HOME/firmware_upload"
        mkdir -p "$UPLOAD_DIR"

        cp -f *.bin "$UPLOAD_DIR/" 2>/dev/null || true
        cp -f *.manifest "$UPLOAD_DIR/" 2>/dev/null || true
        cp -f config.buildinfo "$UPLOAD_DIR/" 2>/dev/null || true
        cp -f feeds.buildinfo "$UPLOAD_DIR/" 2>/dev/null || true
        cp -f version.buildinfo "$UPLOAD_DIR/" 2>/dev/null || true

        echo "=== Built firmware files ==="
        ls -lh "$UPLOAD_DIR"

        # Size sanity check
        for file in "$UPLOAD_DIR"/*-sysupgrade.bin; do
          if [ -f "$file" ]; then
            SIZE=$(stat -c%s "$file")
            SIZE_MB=$((SIZE / 1024 / 1024))
            echo "Sysupgrade size: ${SIZE_MB}MB ($(stat -c%s "$file") bytes)"
            if [ $SIZE -lt 7000000 ]; then
              echo "::warning::Firmware suspiciously small (<7MB). Possible missing packages!"
            fi
            if [ $SIZE -gt 15000000 ]; then
              echo "::warning::Firmware too large (>15MB). Will not fit in 16MB flash!"
            fi
          fi
        done

        echo "FIRMWARE_DIR=$UPLOAD_DIR" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: always() && steps.organize.outputs.status == 'success'
      with:
        name: immortalwrt-${{ env.DEVICE_NAME }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_DIR }}/
        retention-days: 14

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.FILE_DATE }}
        name: "ImmortalWrt 360T6GS Build ${{ env.FILE_DATE }}"
        files: ${{ env.FIRMWARE_DIR }}/*
        draft: false
        prerelease: false
